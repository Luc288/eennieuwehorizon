<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}" />
  <meta name="author" content="{{ .Site.Params.author }}" />
  <link rel="canonical" href="{{ .Permalink }}" />
  <link rel="icon" type="image/svg+xml" href="{{ .Site.Params.logo | relURL }}" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="nl_NL" />
  <meta property="og:title" content="{{ .Title }}" />
  <meta property="og:description" content="{{ .Site.Params.description }}" />
  <meta property="og:url" content="{{ .Permalink }}" />
  <meta property="og:image" content="{{ .Site.Params.bookCover | absURL }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preload" href="{{ "fonts/Jost-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ "fonts/CormorantGaramond-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin />
  <link href="{{ "css/bootstrap.slim.css" | relURL }}" rel="stylesheet" />
  <link rel="stylesheet" href="{{ "css/fonts.css" | relURL }}" />
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
</head>
<body>
  {{ block "main" . }}{{ end }}

  {{ with .Site.Params.turnstileSiteKey }}
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  {{ end }}
  <script src="{{ "js/main.js" | relURL }}" defer></script>
</body>
</html>
